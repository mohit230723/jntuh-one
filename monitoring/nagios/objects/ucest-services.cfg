# =====================================================================
# Nagios Service Check Definitions — UCEST One Infrastructure Probes
# =====================================================================

# 1. Frontend Web UI HTTP Availability Probe (Port 3000 / 5173 / 30080)
define service {
    use                     generic-service
    host_name               ucest-frontend
    service_description     Frontend Web UI Availability
    check_command           check_http!3000!/
    notification_interval   15
}

# 2. Backend Spring Boot 3 Actuator Health Probe (/actuator/health)
define service {
    use                     generic-service
    host_name               ucest-backend
    service_description     Backend Actuator Core Health
    check_command           check_http_string!8080!/actuator/health!"UP"
    notification_interval   10
}

# 3. Database Health Probe via Spring Boot Relational Component
define service {
    use                     generic-service
    host_name               ucest-backend
    service_description     Database Component Health
    check_command           check_http_string!8080!/actuator/health!"database"
    notification_interval   10
}

# 4. Direct MySQL Engine Port Availability Probe (TCP 3306)
define service {
    use                     generic-service
    host_name               ucest-database
    service_description     MySQL Database Port 3306 Listener
    check_command           check_tcp_port!3306
    notification_interval   10
}

# 5. Public Notices REST API Endpoint Latency Probe
define service {
    use                     generic-service
    host_name               ucest-backend
    service_description     Public Notices API Endpoint
    check_command           check_http!8080!/api/public/notices
    notification_interval   15
}

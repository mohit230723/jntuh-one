# UCEST One service checks (Kubernetes NodePorts: frontend 30080, backend 30081).

define service {
    use                     generic-service
    host_name               ucest-frontend
    service_description     Frontend Web UI
    check_command           check_http!30080!/
}

define service {
    use                     generic-service
    host_name               ucest-frontend
    service_description     Notices API through nginx
    check_command           check_http!30080!/api/public/notices
}

define service {
    use                     generic-service
    host_name               ucest-backend
    service_description     Backend Health
    check_command           check_http_string!30081!/actuator/health!UP
}

define service {
    use                     generic-service
    host_name               ucest-backend
    service_description     MySQL Database (via backend)
    check_command           check_http_string!30081!/actuator/health/db!UP
}

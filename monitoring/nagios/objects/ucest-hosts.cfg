# =====================================================================
# Nagios Host Definitions — UCEST One Infrastructure Nodes
# =====================================================================

define host {
    use                     ucest-server
    host_name               ucest-frontend
    alias                   UCEST One Frontend Web Tier (React / Nginx)
    address                 host.docker.internal
    check_command           check-host-alive
}

define host {
    use                     ucest-server
    host_name               ucest-backend
    alias                   UCEST One Backend API Tier (Spring Boot 3)
    address                 host.docker.internal
    check_command           check-host-alive
}

define host {
    use                     ucest-server
    host_name               ucest-database
    alias                   UCEST One Relational Database Tier (MySQL 8)
    address                 host.docker.internal
    check_command           check-host-alive
}

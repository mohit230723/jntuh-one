# UCEST One hosts, monitored through the Kubernetes NodePorts on the laptop.
# Nagios runs in Docker, so the laptop is reached as host.docker.internal.
# Host checks use TCP (ping/ICMP to host.docker.internal does not work from a container).

define host {
    use                     ucest-server
    host_name               ucest-frontend
    alias                   UCEST One Frontend (nginx, NodePort 30080)
    address                 host.docker.internal
    check_command           check_tcp_port!30080
}

define host {
    use                     ucest-server
    host_name               ucest-backend
    alias                   UCEST One Backend API (Spring Boot, NodePort 30081)
    address                 host.docker.internal
    check_command           check_tcp_port!30081
}

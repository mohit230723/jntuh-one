version: '3.8'

services:
  nagios:
    image: jasonrivers/nagios:latest
    container_name: ucest-nagios
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      NAGIOSADMIN_USER: nagiosadmin
      NAGIOSADMIN_PASS: admin123
      NAGIOS_TIMEZONE: "UTC"
    volumes:
      - ./nagios.cfg:/opt/nagios/etc/nagios.cfg:ro
      - ./objects/templates.cfg:/opt/nagios/etc/objects/templates.cfg:ro
      - ./objects/timeperiods.cfg:/opt/nagios/etc/objects/timeperiods.cfg:ro
      - ./objects/contacts.cfg:/opt/nagios/etc/objects/contacts.cfg:ro
      - ./objects/commands.cfg:/opt/nagios/etc/objects/commands.cfg:ro
      - ./objects/ucest-hosts.cfg:/opt/nagios/etc/objects/ucest-hosts.cfg:ro
      - ./objects/ucest-services.cfg:/opt/nagios/etc/objects/ucest-services.cfg:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

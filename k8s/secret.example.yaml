# Kubernetes Secret template — copy to secret.yaml (git-ignored) and change the values:
#   Copy-Item k8s/secret.example.yaml k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
# Jenkins applies it from the "Secret file" credential with ID ucest-k8s-secret.
# Key names must match the secretKeyRef keys in mysql-deployment.yaml and backend-deployment.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: ucest-one-secret
  namespace: ucest-one
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root"
  MYSQL_PASSWORD: "ucest_password"
  SPRING_DATASOURCE_PASSWORD: "root"
  JWT_SECRET: "change-me-to-a-random-string-of-at-least-32-characters"

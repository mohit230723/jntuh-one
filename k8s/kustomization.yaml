apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ucest-one

# secret.yaml is applied separately (it is not in Git), see secret.example.yaml
resources:
  - namespace.yaml
  - configmap.yaml
  - mysql-pv.yaml
  - mysql-deployment.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - services.yaml

configMapGenerator:
  - name: mysql-init-scripts
    files:
      - 01-schema.sql=init-scripts/01-schema.sql
      - 02-seed.sql=init-scripts/02-seed.sql
